{% extends "base.html" %}
{% block title %}Sign In - SmartCoach{% endblock %}
{% block content %}
<div class="row justify-content-center sc-auth">
    <div class="col-md-7 col-lg-5">
        <div class="card">
            <div class="card-header">Sign in to SmartCoach</div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" id="email" name="email" class="form-control"
                               autocomplete="email" autofocus required>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" name="password" class="form-control"
                               autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Sign In</button>
                </form>
            </div>
            <div class="card-footer text-center bg-transparent py-3">
                New to SmartCoach? <a href="{{ url_for('auth.register') }}">Create an account</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
