{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center sc-auth">
    <div class="col-md-8 col-lg-5">
        <div class="card">
            <div class="card-header">Crear cuenta</div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Nombre completo</label>
                        <input type="text" name="full_name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Correo</label>
                        <input type="email" name="email" class="form-control" autocomplete="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña (mínimo 8 caracteres)</label>
                        <input type="password" name="password" class="form-control" minlength="8" autocomplete="new-password" required>
                    </div>
                    <p class="sc-note">Tus datos físicos te los pediremos al generar tu plan.</p>
                    <button type="submit" class="btn btn-primary w-100 mt-2">Crear cuenta</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
