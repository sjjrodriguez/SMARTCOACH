{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center sc-auth">
    <div class="col-md-8 col-lg-6">
        <div class="card">
            <div class="card-header">Registro de Ciclista</div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Nombre Completo</label>
                        <input type="text" name="full_name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>

                    <h6 class="sc-subtitle">Perfil Físico y Disponibilidad</h6>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Edad</label>
                            <input type="number" name="age" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Peso (kg)</label>
                            <input type="number" step="0.1" name="weight_kg" class="form-control" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Horas / Semana</label>
                            <input type="number" step="0.1" name="weekly_hours" class="form-control" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">FC Reposo (lpm)</label>
                            <input type="number" name="resting_heart_rate" class="form-control" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">TSS Acumulado</label>
                            <input type="number" step="0.1" name="tss_acumulado" class="form-control" value="0" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-2">Crear Cuenta</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
