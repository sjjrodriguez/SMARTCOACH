{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-primary text-white fw-bold">Registro de Ciclista</div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label>Nombre Completo</label>
                        <input type="text" name="full_name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Contraseña</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <h6 class="mt-4 text-primary border-bottom pb-2">Perfil Físico y Disponibilidad</h6>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label>Edad</label>
                            <input type="number" name="age" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Peso (kg)</label>
                            <input type="number" step="0.1" name="weight_kg" class="form-control" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label>Horas / Semana</label>
                            <input type="number" step="0.1" name="weekly_hours" class="form-control" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label>FC Reposo (lpm)</label>
                            <input type="number" name="resting_heart_rate" class="form-control" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label>TSS Acumulado</label>
                            <input type="number" step="0.1" name="tss_acumulado" class="form-control" value="0" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-3">Crear Cuenta</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
