{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center sc-action">
    <div class="col-md-8 col-lg-6">
        <div class="card">
            <div class="card-body text-center">
                <h1 class="sc-h1 mb-3">Generador de Plan Inteligente</h1>
                <p class="sc-note mb-4">
                    Nuestra IA de Random Forest evaluará tu perfil fisiológico y
                    disponibilidad de tiempo para asignarte tu categoría ideal.
                </p>
                <form method="POST">
                    <button type="submit" class="btn btn-primary btn-lg px-5">
                        Generar mi plan ahora
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
